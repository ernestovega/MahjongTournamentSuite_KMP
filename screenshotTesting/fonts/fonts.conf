<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  The screenshot tests on Linux see only the fonts of this folder, so every Linux machine draws the same text:
  the text font of the apps (the system font) is Inter here, and the titles use their own bundled font.
  The build sets FONTCONFIG_FILE to this file for the test tasks (root build.gradle.kts).
-->
<fontconfig>
  <dir prefix="relative">.</dir>
  <cachedir prefix="relative">../build/fontconfig-cache</cachedir>
  <alias binding="strong">
    <family>sans-serif</family>
    <prefer><family>Inter</family></prefer>
  </alias>
  <alias binding="strong">
    <family>Noto Sans</family>
    <prefer><family>Inter</family></prefer>
  </alias>
  <alias binding="strong">
    <family>DejaVu Sans</family>
    <prefer><family>Inter</family></prefer>
  </alias>
</fontconfig>
