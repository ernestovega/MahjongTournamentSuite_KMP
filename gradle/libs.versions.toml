[versions]
agp = "9.4.1"
app-versionCode = "1"
app-versionName = "1.0.0"
android-compileSdk = "37"
android-minSdk = "24"
android-targetSdk = "36"
androidx-activity = "1.13.0"
androidx-navigation = "2.10.0"
androidx-lifecycle = "2.11.0"
composeHotReload = "1.2.0"
composeMultiplatform = "1.12.2"
kermit = "2.2.0"
koin = "4.2.2"
kotlin = "2.4.21"
kotlinx-coroutines = "1.11.0"
kotlinx-datetime = "0.8.0"
kotlinx-serialization = "1.12.0"
ktor = "3.6.0"
material3 = "1.12.0-alpha03"
coil = "3.6.3"
google-services = "4.5.0"
firebase-crashlytics-plugin = "3.0.8"

[libraries]
androidx-test-runner = { module = "androidx.test:runner", version = "1.7.0" }
androidx-test-espresso-core = { module = "androidx.test.espresso:espresso-core", version = "3.7.0" }
