<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>MTS screenshot gallery</title>
<style>
:root {
  --bg:#f3f5f3; --card:#fff; --text:#1a1f1b; --muted:#5b655e; --line:#d9e0db; --accent:#1f7a4d; --chip:#e7ede9;
  --ok:#1f7a4d; --warn:#8a5a00; --bad:#b3261e; --okbg:#e1f2e8; --warnbg:#fbefd5; --badbg:#fbe3e1;
  --old:#d32f2f; --oldbg:#fde4e4; --new:#0b7a43; --newbg:#ddf5e8; --h:400px; --top:0px;
}
@media (prefers-color-scheme: dark) { :root {
  --bg:#101311; --card:#1a1e1b; --text:#e6ebe7; --muted:#9aa49d; --line:#2b322d; --accent:#5cc48f; --chip:#242a26;
  --ok:#6fd19c; --warn:#f0b54a; --bad:#ff8a80; --okbg:#163022; --warnbg:#33290f; --badbg:#3a1a18;
  --old:#ff6b6b; --oldbg:#3a1616; --new:#5fd69a; --newbg:#123323; } }
* { box-sizing:border-box; }
html { scroll-padding-top:var(--top); }
body { margin:0; background:var(--bg); color:var(--text); font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
a { color:var(--accent); }
button { font:inherit; color:inherit; }
.muted { color:var(--muted); }

/* header */
header { position:sticky; top:0; z-index:5; background:var(--bg); border-bottom:1px solid var(--line); padding:8px 16px; transition:transform .2s ease; }
/* Hidden while scrolling down; back as soon as the page scrolls up a little. */
header.hidden { transform:translateY(-100%); box-shadow:none; }
.head { display:flex; flex-wrap:wrap; align-items:center; gap:6px 14px; }
h1 { font-size:17px; margin:0; white-space:nowrap; }
nav.tabs { display:flex; gap:2px; }
nav.tabs a { text-decoration:none; color:var(--muted); padding:5px 11px; border-radius:8px; font-weight:600; font-size:14px; white-space:nowrap; }
nav.tabs a.on { background:var(--chip); color:var(--text); }
.grow { flex:1; }
#statusBtn { border:0; border-radius:999px; padding:4px 11px; font-size:13px; cursor:pointer; }
#statusPanel { display:none; padding:8px 0 2px; }
#statusPanel.open { display:block; }
.meta { font-size:13px; color:var(--muted); margin-bottom:6px; }
.status { display:flex; flex-wrap:wrap; gap:6px; }
.pill { font-size:12.5px; border-radius:999px; padding:3px 10px; }
.ok { background:var(--okbg); color:var(--ok); } .warn { background:var(--warnbg); color:var(--warn); } .bad { background:var(--badbg); color:var(--bad); }
.pill a { color:inherit; }

/* toolbar */
.toolbar { display:flex; flex-wrap:wrap; gap:6px 8px; align-items:center; margin-top:8px; }
.toolbar input[type=search] { flex:1 1 180px; min-width:120px; }
input, select { padding:6px 9px; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--text); font:inherit; font-size:14px; min-width:0; max-width:100%; }
.group { display:inline-flex; border:1px solid var(--line); border-radius:9px; overflow:hidden; background:var(--card); }
.group button { border:0; background:transparent; padding:5px 10px; font-size:13px; cursor:pointer; white-space:nowrap; }
.group button + button { border-left:1px solid var(--line); }
.group button[aria-pressed=true] { background:var(--accent); color:#fff; }
.label { font-size:12px; color:var(--muted); margin:0 2px 0 6px; }
#filtersBtn { display:none; }
.btn { border:1px solid var(--line); background:var(--card); border-radius:9px; padding:5px 12px; font-size:13.5px; cursor:pointer; white-space:nowrap; }
.btn.primary { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
.count { font-size:13px; color:var(--muted); }

/* screens */
main { padding:8px 16px 64px; }
h2.module { font-size:15px; margin:22px 0 6px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }
.screen { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 12px 12px; margin:10px 0; }
.screen-head { display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; margin-bottom:8px; }
.screen-head h3 { font-size:15px; margin:0; font-weight:650; }
.row { display:flex; flex-wrap:wrap; gap:12px; align-items:flex-start; }

figure.shot { margin:0; min-width:0; flex:0 1 calc(var(--h) * var(--ar)); cursor:zoom-in; position:relative; }
figure.shot img { display:block; width:100%; height:auto; aspect-ratio:var(--ar); border:1px solid var(--line); border-radius:6px; background:var(--chip); }
figure.shot:hover img { outline:2px solid var(--accent); outline-offset:1px; }
figcaption { font-size:12.5px; color:var(--muted); margin-top:4px; display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
.tag { font-size:11px; font-weight:700; border-radius:5px; padding:1px 6px; letter-spacing:.03em; }
.tag.changed { background:var(--warnbg); color:var(--warn); }
.tag.new { background:var(--newbg); color:var(--new); }
.tag.old { background:var(--old); color:#fff; } .tag.newv { background:var(--new); color:#fff; }
.pager { display:flex; align-items:center; gap:8px; margin:8px 0; flex-wrap:wrap; }
.empty { color:var(--muted); padding:24px 0; }

/* changes */
details.version { background:var(--card); border:1px solid var(--line); border-radius:12px; margin:10px 0; }
details.version summary { cursor:pointer; padding:10px 12px; list-style:none; display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
details.version summary::-webkit-details-marker { display:none; }
details.version summary::before { content:"▸"; color:var(--muted); }
details.version[open] summary::before { content:"▾"; }
.vtitle { font-weight:650; }
.vsub { font-size:13px; color:var(--muted); flex-basis:100%; padding-left:18px; }
.pairs { padding:0 12px 12px; display:flex; flex-direction:column; gap:14px; }
.pair { border-top:1px solid var(--line); padding-top:10px; }
.pair-name { font-size:13.5px; font-weight:600; margin-bottom:6px; cursor:pointer; }
.pair-imgs { display:flex; gap:12px; align-items:flex-start; flex-wrap:wrap; }
.pair-imgs figure.shot { flex-basis:calc(var(--h) * var(--ar)); }
.phead { font-size:16px; font-weight:800; letter-spacing:.04em; color:#fff; padding:5px 10px; border-radius:8px 8px 0 0; text-align:center; line-height:1.2; }
.phead small { display:block; font-size:12px; font-weight:500; letter-spacing:0; }
.phead.o { background:var(--old); } .phead.n { background:var(--new); }
.phead + img { border-radius:0 0 6px 6px !important; }
.frame-old img { border:2px solid var(--old) !important; }
.frame-new img { border:2px solid var(--new) !important; }
.missing { height:calc(var(--h) * .5); min-width:120px; display:flex; align-items:center; justify-content:center; border:1px dashed var(--line); border-radius:6px; color:var(--muted); font-size:13px; padding:8px; text-align:center; }

/* videos */
.videos { display:grid; grid-template-columns:repeat(auto-fill,minmax(min(100%,460px),1fr)); gap:12px; }
.vcard { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 12px 12px; }
.vcard video { width:100%; border-radius:8px; background:#000; margin-top:8px; display:block; }

/* viewer */
#viewer { position:fixed; inset:0; z-index:10; background:#0c0e0d; color:#eee; display:none; flex-direction:column; }
#viewer.open { display:flex; }
#viewer .bar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; padding:8px 12px; border-bottom:1px solid #2a2f2c; }
#viewer .title { font-weight:650; flex:1 1 200px; min-width:0; }
#viewer .title small { display:block; font-weight:400; color:#aab3ad; font-size:12.5px; }
#viewer .group { background:#1b1f1d; border-color:#3a413c; }
#viewer .group button + button { border-color:#3a413c; }
#viewer select { background:#1b1f1d; color:#eee; border-color:#3a413c; }
#viewer .btn { background:#1b1f1d; border-color:#3a413c; color:#eee; }
.navbtn { background:#232825; color:#fff; border:0; min-width:38px; height:38px; border-radius:9px; cursor:pointer; font-size:20px; }
.legend { display:flex; flex-wrap:wrap; gap:8px; align-items:center; padding:6px 12px; border-bottom:1px solid #2a2f2c; font-size:13px; }
.legend .key { display:inline-flex; align-items:center; gap:6px; border-radius:8px; padding:3px 9px; }
.legend .key.o { background:#3a1616; color:#ffb3b3; border:1px solid var(--old); }
.legend .key.n { background:#123323; color:#9ff0c4; border:1px solid var(--new); }
.legend .key b { font-size:11px; letter-spacing:.05em; }
#vStage { flex:1; min-height:0; overflow:auto; padding:12px; display:flex; gap:12px; align-items:flex-start; justify-content:center; flex-wrap:wrap; }
#vStage.fit { align-items:center; }
.pane { display:flex; flex-direction:column; min-width:0; max-width:100%; }
.pane .ph { font-size:20px; font-weight:800; letter-spacing:.04em; padding:6px 14px; border-radius:8px; align-self:stretch; text-align:center; margin-bottom:8px; }
.pane .ph small { display:block; font-size:13px; font-weight:500; letter-spacing:0; opacity:.95; }
.pane.o .ph { background:var(--old); color:#fff; } .pane.n .ph { background:var(--new); color:#fff; }
.pane img { display:block; background:#666; }
.pane.o img { outline:4px solid var(--old); } .pane.n img { outline:4px solid var(--new); }
.fit .pane img, .fit .slider > img, .fit .flip img, .fit .diff img { width:auto; height:auto; max-width:100%; max-height:var(--stageH); }
.side2.fit .pane img { max-height:calc(var(--stageH) - 70px); }
.side2 .pane { flex:1 1 0; align-items:center; }
.side2.fit .pane img { max-width:100%; }
.slider { position:relative; display:inline-block; max-width:100%; user-select:none; touch-action:none; cursor:ew-resize; line-height:0; }
.slider::after { content:""; position:absolute; inset:0; border:4px solid var(--new); pointer-events:none; z-index:1; }
.slider .over { position:absolute; top:0; left:0; bottom:0; overflow:hidden; z-index:2; }
.slider .over::after { content:""; position:absolute; inset:0; border:4px solid var(--old); border-right:0; pointer-events:none; }
.slider .handle, .slider .corner { z-index:3; }
.slider .over img { max-width:none !important; max-height:none !important; }
.slider .handle { position:absolute; top:0; bottom:0; width:4px; margin-left:-2px; background:#fff; box-shadow:0 0 0 1px #000; }
.slider .knob { position:absolute; top:50%; left:-20px; width:44px; height:44px; margin-top:-22px; border-radius:50%; background:#fff; color:#000; display:flex; align-items:center; justify-content:center; font-size:15px; font-weight:700; box-shadow:0 2px 6px rgba(0,0,0,.5); line-height:1; }
.corner { position:absolute; top:10px; font-size:16px; font-weight:800; letter-spacing:.05em; padding:5px 12px; border-radius:6px; line-height:1.2; pointer-events:none; }
.corner.o { left:10px; background:var(--old); color:#fff; } .corner.n { right:10px; background:var(--new); color:#fff; }
.flip { position:relative; display:inline-block; line-height:0; cursor:pointer; }
.flip .corner { left:8px; right:auto; font-size:14px; }
.flip img { outline:4px solid var(--new); } .flip.showOld img { outline-color:var(--old); }
.diff { position:relative; display:inline-block; line-height:0; }
.diff img + img { position:absolute; inset:0; width:100%; height:100%; mix-blend-mode:difference; }
.hint { flex-basis:100%; text-align:center; color:#aab3ad; font-size:12.5px; }
.actual img { max-width:none !important; max-height:none !important; }
#vHistory { display:flex; gap:6px; flex-wrap:wrap; align-items:center; padding:8px 12px; border-top:1px solid #2a2f2c; font-size:13px; }
#vHistory .group button { padding:4px 9px; }

.edge { position:absolute; top:50%; transform:translateY(-50%); z-index:4; width:52px; height:96px; border:0; border-radius:12px; background:rgba(40,46,42,.82); color:#fff; font-size:40px; line-height:1; cursor:pointer; display:flex; align-items:center; justify-content:center; }
.edge:hover { background:rgba(60,70,64,.95); }
.edge.l { left:8px; } .edge.r { right:8px; }
#viewer { overflow:hidden; }
#vWrap { position:relative; flex:1; min-height:0; display:flex; }
#vWrap #vStage { flex:1; padding-left:68px; padding-right:68px; }
#fab { position:fixed; right:18px; bottom:18px; z-index:20; display:none; align-items:center; gap:8px; border:0; border-radius:16px; padding:14px 18px; background:var(--accent); color:#fff; font-weight:700; font-size:15px; box-shadow:0 4px 14px rgba(0,0,0,.35); cursor:pointer; }
#fab.show { display:inline-flex; }
#toast { position:fixed; left:50%; bottom:84px; transform:translateX(-50%); z-index:21; background:#222; color:#fff; padding:10px 16px; border-radius:10px; font-size:14px; display:none; max-width:90vw; white-space:pre-line; box-shadow:0 4px 14px rgba(0,0,0,.4); }
#toast.show { display:block; }
.copy { border:1px solid var(--line); background:var(--card); border-radius:8px; padding:2px 9px; font-size:12.5px; cursor:pointer; margin-left:auto; }
#viewer #vHistory { padding-right:220px; }
/* small screens */
@media (max-width:760px) {
  header { padding:8px 12px; }
  main { padding:6px 12px 64px; }
  #filtersBtn { display:inline-block; }
  .toolbar .more { display:none; }
  .toolbar.open .more { display:contents; }
  .screen { padding:8px; }
  .row { gap:8px; }
  .paged .row { flex-wrap:wrap; }
  #viewer .bar { padding:6px 8px; gap:6px; }
  #vWrap #vStage { padding:8px; }
  .edge { width:36px; height:64px; font-size:28px; background:rgba(40,46,42,.6); }
  .edge.l { left:2px; } .edge.r { right:2px; }
  #vStage.side2 { flex-direction:column; flex-wrap:nowrap; align-items:center; }
  #vStage.side2 .pane { flex:none; width:100%; }
  #vStage.side2.fit .pane img { max-height:none; max-width:100%; }
  #viewer .title { font-size:14px; flex-basis:calc(100% - 140px); order:1; }
  #viewer #vClose { order:2; margin-left:auto; }
  #viewer #vPrev, #viewer #vNext { display:none; }
  #viewer .bar .group { order:3; overflow-x:auto; max-width:100%; }
  #viewer #vZoom { order:4; }
  .legend { font-size:12.5px; padding:6px 8px; }
  .pane .ph { font-size:17px; }
  #fab { right:12px; bottom:12px; padding:12px 14px; }
  #viewer #vHistory { padding-right:12px; padding-bottom:70px; }
}
</style>
</head>
<body>
<header id="header">
  <div class="head">
    <h1>MTS screenshots</h1>
    <nav class="tabs" id="tabs">
      <a href="#screens" data-tab="screens">Screens</a>
      <a href="#changes" data-tab="changes">Changes</a>
      <a href="#videos" data-tab="videos">Game day videos</a>
    </nav>
    <span class="grow"></span>
    <button id="statusBtn" class="ok" aria-expanded="false">Status</button>
  </div>
  <div id="statusPanel"><div class="meta" id="meta"></div><div class="status" id="status"></div></div>
  <div class="toolbar" id="toolbar"></div>
</header>
<main id="main"><p class="empty">Loading…</p></main>

<button id="fab" title="Copy a text that identifies this screenshot (C)">📋 Copy reference</button>
<div id="toast" role="status"></div>
<div id="viewer" role="dialog" aria-modal="true" aria-label="Image viewer">
  <div class="bar">
    <button class="navbtn" id="vPrev" title="Previous (←)" aria-label="Previous">‹</button>
    <button class="navbtn" id="vNext" title="Next (→)" aria-label="Next">›</button>
    <div class="title" id="vTitle"></div>
    <div class="group" id="vModes"></div>
    <button class="btn" id="vZoom" title="Fit to the window or real pixels (Z)">Fit</button>
    <button class="navbtn" id="vClose" title="Close (Esc)" aria-label="Close">✕</button>
  </div>
  <div class="legend" id="vLegend"></div>
  <div id="vWrap">
    <button class="edge l" id="vEdgePrev" title="Previous image (←)" aria-label="Previous image">‹</button>
    <div id="vStage"></div>
    <button class="edge r" id="vEdgeNext" title="Next image (→)" aria-label="Next image">›</button>
  </div>
  <div id="vHistory"></div>
</div>

<script>
"use strict";
const $ = (s, root = document) => root.querySelector(s);
function h(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k.startsWith("on")) e[k] = v;
    else if (k === "text") e.textContent = v;
    else if (k === "style" && typeof v === "object") Object.assign(e.style, v);
    else e.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) e.append(k);
  return e;
}
const store = {
  get(k, d) { try { const v = localStorage.getItem("gallery." + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("gallery." + k, JSON.stringify(v)); } catch (e) {} },
};

const DEVICES = [["phone", "Phone"], ["narrow", "Small phone"], ["tablet", "Tablet"], ["desktop", "Desktop"]];
// The language is the third part of a variant ("phone-light-de"); without it the image is in English. A last part
// "font150" or "font200" is the large text of the accessibility settings ("phone-light-font150").
const LANGUAGES = [["en", "EN", "English"], ["de", "DE", "Deutsch"], ["es", "ES", "Español"], ["fr", "FR", "Français"], ["it", "IT", "Italiano"], ["nl", "NL", "Nederlands"], ["ru", "RU", "Русский"], ["sv", "SV", "Svenska"]];
const languageOf = (variant) => variant.split("-").slice(2).find((p) => !p.startsWith("font")) || "en";
const fontOf = (variant) => { const p = variant.split("-").find((x) => /^font\d+$/.test(x)); return p ? Number(p.slice(4)) : 100; };
const THEMES = [["light", "Light"], ["dark", "Dark"]];
const SIZES = [["s", "S", 220], ["m", "M", 380], ["l", "L", 600], ["fit", "Fit", 0]];
const VARIANT_ORDER = ["phone-light", "phone-dark", "narrow-light", "tablet-light", "tablet-dark", "desktop-light", "desktop-dark"];

let M = null, KEYS = [], LABELS = {}, THUMBS = "thumb";
const state = {
  tab: "screens", module: store.get("module", "all"), devices: new Set(store.get("devices", [])),
  themes: new Set(store.get("themes", [])), languages: new Set(store.get("languages", [])), q: "", version: 0, onlyChanged: false,
  size: store.get("size", "m"), paged: store.get("paged", false), page: 0, filtersOpen: false,
};

// ---------------------------------------------------------------- labels
const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
function when(iso) {
  const d = new Date(iso);
  const time = d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  return `${d.getDate()} ${MONTHS[d.getMonth()]} ${time}`;
}
function ago(iso) {
  const s = (Date.now() - new Date(iso)) / 1000;
  if (s < 3600) return `${Math.max(1, Math.round(s / 60))} min ago`;
  if (s < 86400) return `${Math.round(s / 3600)} h ago`;
  return `${Math.round(s / 86400)} days ago`;
}
/** "17 Nov 15:20 · web 1.0.264": the date says when, the version says what was published around then. */
function vName(i, withApp = false) {
  const v = M.versions[i];
  return `${when(v.date)}${v.web ? " · web " + v.web : ""}${withApp && v.app ? " · app " + v.app : ""}`;
}
const commitUrl = (sha) => `https://github.com/${M.repo}/commit/${sha}`;
const thumb = (oid) => `${THUMBS}/${oid}.webp`;
const full = (oid) => `img/${oid}.png`;
const ar = (oid) => { const d = M.dims && M.dims[oid]; return d ? d[0] / d[1] : 0.5; };
const moduleOf = (key) => key.split("/")[0];
const screenOf = (key) => key.slice(key.indexOf("/") + 1, key.lastIndexOf("/"));
const variantOf = (key) => key.slice(key.lastIndexOf("/") + 1);
function variantName(variant) {
  const [device, theme] = variant.split("-");
  const language = languageOf(variant) === "en" ? null : languageOf(variant);
  const d = { phone: "Phone", narrow: "Small phone", tablet: "Tablet", desktop: "Desktop" }[device] || device;
  const l = language ? LANGUAGES.find((x) => x[0] === language) : null;
  const font = fontOf(variant) === 100 ? null : `Text ${fontOf(variant)} %`;
  return [d, theme, language ? (l ? l[2] : language) : null, font].filter(Boolean).join(" · ");
}
/** English first, in the order of VARIANT_ORDER, then the other languages in the order of LANGUAGES. */
function variantRank(key) {
  const variant = variantOf(key);
  const i = VARIANT_ORDER.indexOf(variant.split("-").slice(0, 2).join("-"));
  const l = LANGUAGES.findIndex((x) => x[0] === languageOf(variant));
  return (l < 0 ? 99 : l) * 100 + (i < 0 ? 99 : i) + fontOf(variant) / 1000;
}

// An image's entries are [version index, id or null], newest first. At version k it is the first entry with index >= k.
const entriesOf = (key) => M.images[key] || [];
function entryAt(key, k) { return entriesOf(key).find((e) => e[0] >= k) || null; }
function oidAt(key, k) { const e = entryAt(key, k); return e ? e[1] : null; }
function changedIn(key, k) { return k < M.versions.length - 1 && entriesOf(key).some((e) => e[0] === k); }
function olderEntry(key, k) { const e = entryAt(key, k); return e ? entriesOf(key).find((x) => x[0] > e[0]) || null : null; }

// ---------------------------------------------------------------- load
async function load() {
  const res = await fetch("manifest.json", { cache: "no-cache" });
  M = await res.json();
  THUMBS = (M.files && M.files.thumbDir) || "thumb";
  KEYS = Object.keys(M.images).sort((a, b) => {
    const sa = a.slice(0, a.lastIndexOf("/")), sb = b.slice(0, b.lastIndexOf("/"));
    return sa < sb ? -1 : sa > sb ? 1 : variantRank(a) - variantRank(b);
  });
  for (const m of M.modules) LABELS[m.id] = m.label;

    paint();
    const auto = h("button", { class: "btn", text: "Auto flip" });
    auto.onclick = () => { if (V.timer) { clearInterval(V.timer); V.timer = null; auto.textContent = "Auto flip"; } else { V.timer = setInterval(() => { V.showOld = !V.showOld; paint(); }, 900); auto.textContent = "Stop"; } };
    stage.append(box, h("div", { class: "hint" }, "Click the image or press Space to switch between BEFORE and AFTER. ", auto));
  } else {
    stage.append(h("div", { class: "diff" }, img(oldOid, "old"), img(newOid, "new")),
      h("div", { class: "hint", text: `Black: the same in both. Bright: what changed between BEFORE (${vName(V.old)}) and AFTER (${vName(V.version)}).` }));
  }

  const hist = $("#vHistory"); hist.replaceChildren(h("span", { text: "Versions of this image:" }));
  hist.append(h("div", { class: "group" }, entriesOf(key).map((e) =>
    h("button", { "aria-pressed": String(cur && e[0] === cur[0]), title: M.versions[e[0]].subject, onclick: () => { V.version = e[0]; show(); },
      text: vName(e[0]) + (e[1] ? "" : " (removed)") }))));
  if (entriesOf(key).length && entriesOf(key)[entriesOf(key).length - 1][0] === M.versions.length - 1) hist.append(h("span", { style: { color: "#8a948e" }, text: "Older ones are not kept." }));
}

function slider(oldOid, newOid) {
  const base = h("img", { src: full(newOid), alt: "new", width: (M.dims[newOid] || [])[0], height: (M.dims[newOid] || [])[1] });
  const overImg = h("img", { src: full(oldOid), alt: "old" });
  const over = h("div", { class: "over" }, overImg);
  const handle = h("div", { class: "handle" }, h("div", { class: "knob", text: "‹ ›" }));
  const wrap = h("div", { class: "slider" }, base, over, handle,
    h("span", { class: "corner o", text: "◀ BEFORE" }), h("span", { class: "corner n", text: "AFTER ▶" }));
  const set = (f) => { f = Math.min(1, Math.max(0, f)); over.style.width = f * 100 + "%"; handle.style.left = f * 100 + "%"; };
  const sync = () => { overImg.style.width = base.clientWidth + "px"; overImg.style.height = base.clientHeight + "px"; };
  base.onload = sync; new ResizeObserver(sync).observe(base);
  const move = (e) => { const r = wrap.getBoundingClientRect(); set((e.clientX - r.left) / r.width); };
  let dragging = false;
  wrap.onpointerdown = (e) => { dragging = true; wrap.setPointerCapture(e.pointerId); move(e); };
  wrap.onpointermove = (e) => { if (dragging || e.pointerType === "mouse") move(e); };
  wrap.onpointerup = () => { dragging = false; };
  set(0.5);
  return wrap;
}

$("#vClose").onclick = closeViewer;
$("#vPrev").onclick = () => step(-1);
$("#vEdgePrev").onclick = () => step(-1);
$("#vEdgeNext").onclick = () => step(1);
// Swipe left or right on a phone or tablet. Not on the slider, which uses the same gesture.
(() => {
  let x0 = null, y0 = null;
  const stage = $("#vWrap");
  stage.addEventListener("touchstart", (e) => {
    if (e.touches.length !== 1 || e.target.closest(".slider") || !V.fit) { x0 = null; return; }
    x0 = e.touches[0].clientX; y0 = e.touches[0].clientY;
  }, { passive: true });
  stage.addEventListener("touchend", (e) => {
    if (x0 == null) return;
    const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0;
    x0 = null;
    if (Math.abs(dx) > 60 && Math.abs(dx) > 1.5 * Math.abs(dy)) step(dx < 0 ? 1 : -1);
  }, { passive: true });
})();
$("#vNext").onclick = () => step(1);
$("#vZoom").onclick = () => { V.fit = !V.fit; V.keepOld = true; show(); };
document.addEventListener("keydown", (e) => {
  if (e.target.matches("input, select, textarea")) return;
  const open = $("#viewer").classList.contains("open");
  if (open) {
    if (e.key === "Escape") closeViewer();
    else if (e.key === "ArrowLeft") step(-1);
    else if (e.key === "ArrowRight") step(1);
    else if (e.key === " " && V.mode === "flip") { e.preventDefault(); V.showOld = !V.showOld; V.keepOld = true; show(); }
    else if (e.key === "c" || e.key === "C") { fabAction && fabAction(); }
    else if (e.key === "z" || e.key === "Z") { V.fit = !V.fit; V.keepOld = true; show(); }
    else { const m = MODES.find((x) => x[2] === e.key); if (m) setMode(m[0]); }
  } else if (state.tab === "screens" && state.paged && (e.key === "j" || e.key === "k")) {
    state.page += e.key === "j" ? 1 : -1; renderScreens(); window.scrollTo(0, 0);
  }
});
window.addEventListener("resize", () => { if ($("#viewer").classList.contains("open")) { V.keepOld = true; show(); } });

load().catch((e) => { $("#main").replaceChildren(h("p", { class: "empty", text: "Could not load the gallery: " + e })); });
</script>
</body>
