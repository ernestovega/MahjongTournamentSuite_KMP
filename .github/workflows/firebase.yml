# Checks every pull request to main and deploys Firebase when main changes.
# Setup of the Google Cloud credentials: docs/ci-deploy.md
name: Firebase

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Never cancel a deploy halfway. A newer push waits for the running one.
  group: firebase-${{ github.event_name == 'pull_request' && github.head_ref || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  FIREBASE_PROJECT: mahjong-tournament-suite

jobs:
  # The checks below run at the same time. The job "Build and test" at the end is the one the ruleset of main requires.
  functions:
    name: Functions tests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: firebase/functions/package-lock.json

      - name: Test functions
        working-directory: firebase/functions
        run: |
          npm ci --no-audit --no-fund
          npm test

  kotlin:
    name: Kotlin tests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # A hung UI test must not use a long time.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Test Kotlin code
        run: >
          ./gradlew
          :domain:jvmTest :data:jvmTest :ui:jvmTest :adminApp:jvmTest :playerApp:jvmTest
          :androidApp:testDebugUnitTest :playerAndroidApp:testDebugUnitTest

  scripts:
    name: Scripts and diagnostics tests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test scripts and start diagnostics
        run: |
          node --test scripts/recovery.test.mjs
          node --test playerApp/diagnostics-test/*.test.mjs

  web:
    name: Build web apps
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build web apps
        run: ./gradlew :adminApp:wasmJsBrowserDistribution :playerApp:wasmJsBrowserDistribution

  android:
    name: Build the UI tests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # The UI tests run at night (ui-tests-nightly.yml). This keeps them compiling.
      - name: Build the UI tests
        run: ./gradlew :androidApp:assembleDebugAndroidTest :playerAndroidApp:assembleDebugAndroidTest

  check:
    name: Build and test
    if: ${{ always() && github.event_name == 'pull_request' }}
    needs: [functions, kotlin, scripts, web, android]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail when a check did not pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || exit 1
          done

  deploy:
    name: Deploy to Firebase
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            firebase/functions/package-lock.json

      - name: Install Firebase CLI and functions dependencies
        run: |
          npm ci --no-audit --no-fund
          npm ci --no-audit --no-fund --prefix firebase/functions

      - name: Test functions
        working-directory: firebase/functions
        run: npm test

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      # The predeploy steps in firebase.json build both web apps and the functions.
      # --force lets the deploy delete functions that were removed from the code.
      - name: Deploy
        run: >
          npx firebase deploy
          --only hosting,functions,firestore,storage
          --project "$FIREBASE_PROJECT"
          --non-interactive
          --force
