# Runs every test on the pull request from develop to main. When main changes, deploys Firebase and publishes the
# Android apps that have a new version code on Google Play (docs/android-release.md).
# Setup of the Google Cloud credentials: docs/ci-deploy.md
# The name says what it does, not where: the tests run in GitHub runners, only the deploy goes to Firebase.
name: Tests and deploy

on:
  pull_request:
    # The work is merged into develop without a pull request. A pull request from develop to main runs every test.
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Never cancel a deploy halfway. A newer push waits for the running one.
  group: firebase-${{ github.event_name == 'pull_request' && github.head_ref || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  FIREBASE_PROJECT: mahjong-tournament-suite

jobs:
  # The checks below run at the same time. The job "Build and test" at the end is the one the ruleset of main requires.
  functions:
    name: Functions tests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # The version check compares the branch with main.
          fetch-depth: 0

      # Fails when the web, the admin app or the player app changed without a higher version.
      # See docs/versioning.md.
      - name: Check versions
        run: python3 scripts/versions.py check --base "origin/${{ github.base_ref }}"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: firebase/functions/package-lock.json

      - name: Test functions
        working-directory: firebase/functions
        run: |
          npm ci --no-audit --no-fund
          npm test

  integration:
    name: Functions integration tests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            firebase/functions/package-lock.json

      # The tests run on the Firebase Auth and Firestore emulators. No test touches the production project.
      - name: Test functions with the emulators
        run: |
          npm ci --no-audit --no-fund
          npm ci --no-audit --no-fund --prefix firebase/functions
          echo "$GITHUB_WORKSPACE/node_modules/.bin" >> "$GITHUB_PATH"
          export PATH="$GITHUB_WORKSPACE/node_modules/.bin:$PATH"
          npm run test:integration --prefix firebase/functions

  kotlin:
    name: Kotlin tests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # A hung UI test must not use a long time.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Check the Kotlin style
        # --continue lists the style problems of every module, not only of the first one that fails.
        run: ./gradlew ktlintCheck --continue

      - name: Test Kotlin code
        run: >
          ./gradlew
          :domain:jvmTest :data:jvmTest :ui:jvmTest :adminApp:jvmTest :playerApp:jvmTest
          :androidApp:testDebugUnitTest :playerAndroidApp:testDebugUnitTest

  scripts:
    name: Scripts and diagnostics tests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test scripts and start diagnostics
        run: |
          node --test scripts/recovery.test.mjs
          node --test playerApp/diagnostics-test/*.test.mjs

  web:
    name: Build web apps
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build web apps
        run: ./gradlew :adminApp:wasmJsBrowserDistribution :playerApp:wasmJsBrowserDistribution

  # The UI tests do not run here until the apps are in production: they take close to an hour. Run them by hand with
  # Actions > UI tests > Run workflow. See docs/instrumented-ui-tests.md.

  check:
    name: Build and test
    if: ${{ always() && github.event_name == 'pull_request' }}
    needs: [functions, integration, kotlin, scripts, web]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail when a check did not pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || exit 1
          done

  deploy:
    name: Deploy to Firebase
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            firebase/functions/package-lock.json

      - name: Install Firebase CLI and functions dependencies
        run: |
          npm ci --no-audit --no-fund
          npm ci --no-audit --no-fund --prefix firebase/functions

      - name: Test functions
        working-directory: firebase/functions
        run: npm test

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      # The predeploy steps in firebase.json build both web apps and the functions.
      # --force lets the deploy delete functions that were removed from the code.
      - name: Deploy
        run: >
          npx firebase deploy
          --only hosting,functions,firestore,storage
          --project "$FIREBASE_PROJECT"
          --non-interactive
          --force

  # Runs next to the Firebase deploy. Setup of Google Play and the upload keystores: docs/android-release.md.
  play:
    name: Publish to Google Play
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      # Repository variables can change the track or the status. See docs/android-release.md.
      PLAY_TRACK: ${{ vars.PLAY_TRACK || 'internal' }}
      PLAY_RELEASE_STATUS: ${{ vars.PLAY_RELEASE_STATUS || 'completed' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the Google Play client
        run: pip install --quiet google-auth google-api-python-client

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      # Only an app whose version code is not on Google Play yet is built and uploaded.
      - name: Find the apps with a new version
        id: pending
        run: python3 scripts/play.py pending

      - uses: actions/setup-java@v4
        if: steps.pending.outputs.admin == 'true' || steps.pending.outputs.player == 'true'
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        if: steps.pending.outputs.admin == 'true' || steps.pending.outputs.player == 'true'

      # The upload keystores come from secrets of the environment "production". The build reads them through the
      # variables MTS_ADMIN_SIGNING_* and MTS_PLAYER_SIGNING_*.
      - name: Build the admin app
        if: steps.pending.outputs.admin == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.MTS_ADMIN_UPLOAD_KEYSTORE_BASE64 }}
          MTS_ADMIN_SIGNING_STORE_PASSWORD: ${{ secrets.MTS_ADMIN_UPLOAD_STORE_PASSWORD }}
          MTS_ADMIN_SIGNING_KEY_PASSWORD: ${{ secrets.MTS_ADMIN_UPLOAD_KEY_PASSWORD }}
          MTS_ADMIN_SIGNING_KEY_ALIAS: ${{ secrets.MTS_ADMIN_UPLOAD_KEY_ALIAS || 'upload' }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$MTS_ADMIN_SIGNING_STORE_PASSWORD" ]; then
            echo "::error::The admin upload keystore secrets are missing. See docs/android-release.md."
            exit 1
          fi
          export MTS_ADMIN_SIGNING_STORE_FILE="$RUNNER_TEMP/mts-admin-upload.jks"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$MTS_ADMIN_SIGNING_STORE_FILE"
          ./gradlew :androidApp:bundleRelease

      - name: Build the player app
        if: steps.pending.outputs.player == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.MTS_PLAYER_UPLOAD_KEYSTORE_BASE64 }}
          MTS_PLAYER_SIGNING_STORE_PASSWORD: ${{ secrets.MTS_PLAYER_UPLOAD_STORE_PASSWORD }}
          MTS_PLAYER_SIGNING_KEY_PASSWORD: ${{ secrets.MTS_PLAYER_UPLOAD_KEY_PASSWORD }}
          MTS_PLAYER_SIGNING_KEY_ALIAS: ${{ secrets.MTS_PLAYER_UPLOAD_KEY_ALIAS || 'upload' }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$MTS_PLAYER_SIGNING_STORE_PASSWORD" ]; then
            echo "::error::The player upload keystore secrets are missing. See docs/android-release.md."
            exit 1
          fi
          export MTS_PLAYER_SIGNING_STORE_FILE="$RUNNER_TEMP/mts-player-upload.jks"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$MTS_PLAYER_SIGNING_STORE_FILE"
          ./gradlew :playerAndroidApp:bundleRelease

      - name: Upload the admin app
        if: steps.pending.outputs.admin == 'true'
        run: python3 scripts/play.py upload admin androidApp/build/outputs/bundle/release/*.aab

      - name: Upload the player app
        if: steps.pending.outputs.player == 'true'
        run: python3 scripts/play.py upload player playerAndroidApp/build/outputs/bundle/release/*.aab

      - name: Remove the keystores
        if: always()
        run: rm -f "$RUNNER_TEMP"/mts-*-upload.jks
