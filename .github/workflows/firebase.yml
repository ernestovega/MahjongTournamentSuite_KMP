# Checks every pull request to main and deploys Firebase when main changes.
# Setup of the Google Cloud credentials: docs/ci-deploy.md
name: Firebase

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Never cancel a deploy halfway. A newer push waits for the running one.
  group: firebase-${{ github.event_name == 'pull_request' && github.head_ref || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  FIREBASE_PROJECT: mahjong-tournament-suite

jobs:
  check:
    name: Build and test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: firebase/functions/package-lock.json

      - name: Test functions
        working-directory: firebase/functions
        run: |
          npm ci --no-audit --no-fund
          npm test

      - name: Build web apps
        run: ./gradlew :adminApp:wasmJsBrowserDistribution :playerApp:wasmJsBrowserDistribution

      # The UI tests only run by hand (ui-tests.yml). This keeps them compiling.
      - name: Build the UI tests
        run: ./gradlew :androidApp:assembleDebugAndroidTest :playerAndroidApp:assembleDebugAndroidTest

  deploy:
    name: Deploy to Firebase
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            firebase/functions/package-lock.json

      - name: Install Firebase CLI and functions dependencies
        run: |
          npm ci --no-audit --no-fund
          npm ci --no-audit --no-fund --prefix firebase/functions

      - name: Test functions
        working-directory: firebase/functions
        run: npm test

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      # The predeploy steps in firebase.json build both web apps and the functions.
      # --force lets the deploy delete functions that were removed from the code.
      - name: Deploy
        run: >
          npx firebase deploy
          --only hosting,functions,firestore,storage
          --project "$FIREBASE_PROJECT"
          --non-interactive
          --force
