# Runs every test on the pull request from develop to main, or when it is started by hand on a branch that is not
# main (Actions > Deploy · Production > Run workflow > pick the branch): then it only tests and deploys nothing.
# When main changes, deploys Firebase and publishes the Android apps that have a new version code on Google Play
# (docs/android-release.md).
# Setup of the Google Cloud credentials: docs/ci-deploy.md
# The name says what it does, not where: the tests run in GitHub runners, only the deploy goes to Firebase.
name: Deploy · Production

on:
  pull_request:
    # The work is merged into develop without a pull request. A pull request from develop to main runs every test.
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Never cancel a deploy halfway. A newer push waits for the running one. A run by hand on another branch only tests:
  # it has its own group, so it never holds back a deploy of main.
  group: firebase-${{ github.event_name == 'pull_request' && github.head_ref || github.ref != 'refs/heads/main' && github.ref || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  FIREBASE_PROJECT: mahjong-tournament-suite

jobs:
  # The checks below run at the same time. The job "Build and test" at the end is the one the ruleset of main requires.
  functions:
    name: Functions tests
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          # The version check compares the branch with main.
          fetch-depth: 0

      # Fails when the web or the Android and desktop app changed without a higher version.
      # See docs/versioning.md.
      - name: Check versions
        # By hand on a branch there is no base branch: the branch is compared with main.
        run: python3 scripts/versions.py check --base "origin/${{ github.base_ref || 'main' }}"

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: firebase/functions/package-lock.json

      - name: Test functions
        working-directory: firebase/functions
        run: |
          npm ci --no-audit --no-fund
          npm test

  integration:
    name: Functions integration tests
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            firebase/functions/package-lock.json

      # The tests run on the Firebase Auth and Firestore emulators. No test touches the production project.
      - name: Test functions with the emulators
        run: |
          npm ci --no-audit --no-fund
          npm ci --no-audit --no-fund --prefix firebase/functions
          echo "$GITHUB_WORKSPACE/node_modules/.bin" >> "$GITHUB_PATH"
          export PATH="$GITHUB_WORKSPACE/node_modules/.bin:$PATH"
          npm run test:integration --prefix firebase/functions

  kotlin:
    name: Kotlin tests
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')
    runs-on: ubuntu-latest
    # A hung UI test must not use a long time.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Check the Kotlin style
        # --continue lists the style problems of every module, not only of the first one that fails. By hand on a
        # branch the style is only reported: main has old style problems, and the tests below must run anyway.
        continue-on-error: ${{ github.event_name != 'pull_request' }}
        run: ./gradlew ktlintCheck --continue

      - name: Test Kotlin code
        run: >
          ./gradlew
          :domain:jvmTest :data:jvmTest :designsystem:jvmTest :ui:jvmTest :adminApp:jvmTest :playerApp:jvmTest
          :androidApp:testDebugUnitTest

  scripts:
    name: Scripts and diagnostics tests
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Test scripts and start diagnostics
        run: |
          node --test scripts/recovery.test.mjs
          python3 -m unittest discover -s scripts -p "*_test.py"
          node --test playerApp/diagnostics-test/*.test.mjs

  web:
    name: Build web apps
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Build web apps
        run: ./gradlew :adminApp:wasmJsBrowserDistribution :playerApp:wasmJsBrowserDistribution

  # The UI tests do not run here until the apps are in production: they take close to an hour. Run them by hand with
  # Actions > Test · UI (emulators) > Run workflow. See docs/instrumented-ui-tests.md.

  check:
    name: Build and test
    if: ${{ always() && (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')) }}
    needs: [functions, integration, kotlin, scripts, web]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail when a check did not pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || exit 1
          done

  # Until production (Ernesto, 2026-11-19) the deploy runs no test: the tests run on the computer before the push.
  deploy:
    name: Deploy to Firebase
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            firebase/functions/package-lock.json

      - name: Install Firebase CLI and functions dependencies
        run: |
          npm ci --no-audit --no-fund
          npm ci --no-audit --no-fund --prefix firebase/functions

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      # The first deploy of the registrations made registrationsHourly in Madrid, where Cloud Scheduler does not exist, so
      # the Firebase CLI cannot delete it (it asks for its scheduler job there first). gcloud deletes the function alone.
      # It does nothing once that function is gone.
      - name: Remove the old registrationsHourly of Madrid
        run: |
          if gcloud functions describe registrationsHourly --region=europe-southwest1 --project="$FIREBASE_PROJECT" >/dev/null 2>&1; then
            gcloud functions delete registrationsHourly --region=europe-southwest1 --project="$FIREBASE_PROJECT" --quiet
          fi

      # The predeploy steps in firebase.json build both web apps and the functions.
      # --force lets the deploy delete functions that were removed from the code.
      - name: Deploy
        run: >
          npx firebase deploy
          --only hosting,functions,firestore,storage
          --project "$FIREBASE_PROJECT"
          --non-interactive
          --force

      # The table of versions in the summary of the run. Google Play is shown by the job below and by
      # Actions > Check · Published versions.
      - name: Show the versions
        if: always()
        run: python3 scripts/versions.py status

  # Setup of Google Play and the upload keystores: docs/android-release.md.
  # Paused on push (Ernesto, 2026-11-11): small changes must not reach Google Play. It runs only when the workflow is
  # started by hand on main, from the Actions tab. To publish on every push again, put back `github.event_name != 'pull_request'`.
  play:
    name: Publish to Google Play
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      # Repository variables can change the track or the status. See docs/android-release.md.
      PLAY_TRACK: ${{ vars.PLAY_TRACK || 'internal' }}
      PLAY_RELEASE_STATUS: ${{ vars.PLAY_RELEASE_STATUS || 'completed' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install the Google Play client
        run: pip install --quiet google-auth google-api-python-client

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      # Only an app whose version code is not on Google Play yet is built and uploaded.
      - name: Find the apps with a new version
        id: pending
        run: python3 scripts/play.py pending

      - uses: actions/setup-java@v6
        if: steps.pending.outputs.admin == 'true'
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6
        if: steps.pending.outputs.admin == 'true'

      # The upload keystores come from secrets of the environment "production". The build reads them through the
      # variables MTS_SIGNING_*.
      - name: Build the app
        if: steps.pending.outputs.admin == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.MTS_UPLOAD_KEYSTORE_BASE64 }}
          MTS_SIGNING_STORE_PASSWORD: ${{ secrets.MTS_UPLOAD_STORE_PASSWORD }}
          MTS_SIGNING_KEY_PASSWORD: ${{ secrets.MTS_UPLOAD_KEY_PASSWORD }}
          MTS_SIGNING_KEY_ALIAS: ${{ secrets.MTS_UPLOAD_KEY_ALIAS || 'upload' }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$MTS_SIGNING_STORE_PASSWORD" ]; then
            echo "::error::The upload keystore secrets are missing. See docs/android-release.md."
            exit 1
          fi
          export MTS_SIGNING_STORE_FILE="$RUNNER_TEMP/mts-upload.jks"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$MTS_SIGNING_STORE_FILE"
          ./gradlew :androidApp:bundleRelease

      - name: Upload the app
        if: steps.pending.outputs.admin == 'true'
        run: python3 scripts/play.py upload admin androidApp/build/outputs/bundle/release/*.aab

      - name: Remove the keystores
        if: always()
        run: rm -f "$RUNNER_TEMP"/mts-upload.jks

      - name: Show the versions
        if: always()
        run: python3 scripts/versions.py status
