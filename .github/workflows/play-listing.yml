# Uploads the Google Play store listing (texts, screenshots and feature graphic of the 8 languages) from docs/play-store/.
# Only by hand: Actions > Publish · Play store listing > Run workflow. "check" asks Play and changes nothing; "upload"
# replaces the listing. See docs/play-store/README.md and scripts/play_listing.py.
name: Publish · Play store listing

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "check: change nothing, only show what is on Play. upload: replace the listing on Play."
        type: choice
        options: [check, upload]
        default: check

jobs:
  listing:
    name: Play store listing
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install the Google Play client
        run: pip install --quiet google-auth google-api-python-client

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: ${{ inputs.mode == 'upload' && 'Upload the listing' || 'Check the listing' }}
        run: python3 scripts/play_listing.py ${{ inputs.mode }}
