# A game day scenario in staging (docs/scenarios.md): a whole tournament played without anybody, through the apps.
# Run it by hand from Actions > Game day. It never touches the production project. The tournaments stay in staging.
name: Game day

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: "The tournament: small (24 players, 4 rounds), medium (64 players, 7 rounds) or large (240 players, 11 rounds)."
        type: choice
        options: [small, medium, large]
        default: small
      phone_emulators:
        description: "Phone emulators: on about 5 h / 3 h 15 / 2 h, off about 2 h 30 / 1 h 30 / 50 min (240 / 64 / 24 players). The admin tablet plays always."
        type: boolean
        default: false
      teams:
        description: "Teams."
        type: boolean
        default: true
      chicken:
        description: "Chicken hands counted."
        type: boolean
        default: true
      best:
        description: "Best hands counted."
        type: boolean
        default: true

concurrency:
  group: scenario
  cancel-in-progress: false

permissions:
  contents: read

env:
  STAGING: ${{ vars.STAGING_FIREBASE_PROJECT }}

jobs:
  # Main goes to staging first: the app of the test and the backend it talks to are the same commit.
  staging:
    name: Deploy main to staging
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/staging.yml
    with:
      action: deploy
    secrets: inherit
    permissions:
      contents: read
      id-token: write

  # The plan: who plays each slot, and the import files. It reads the EMA registry and the accounts of staging.
  plan:
    name: Plan of the scenario
    needs: staging
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check the staging project
        run: |
          if [ -z "$STAGING" ] || [ "$STAGING" = "mahjongtournamentsuite" ]; then
            echo "::error::Set the variable STAGING_FIREBASE_PROJECT to the staging project."
            exit 1
          fi

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: firebase/functions/package-lock.json

      - run: npm ci --no-audit --no-fund --prefix firebase/functions && npm run build --prefix firebase/functions

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.STAGING_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.STAGING_GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      # The bot admin is the organizer. The same step of the calibration makes it, with its password and its alias.
      - name: Prepare the bot admin
        working-directory: firebase/functions
        env:
          STAGING_ADMIN_EMAIL: ${{ secrets.STAGING_ADMIN_EMAIL }}
        run: |
          export GCLOUD_PROJECT="$STAGING" EMA_FIREBASE_PROJECT="$STAGING"
          REHEARSAL_PASSWORD="$(gcloud secrets versions access latest --secret=REHEARSAL_PASSWORD --project="$STAGING")"
          echo "::add-mask::$REHEARSAL_PASSWORD"
          export REHEARSAL_PASSWORD
          node lib/scripts/rehearsalAccounts.js --calibration-setup --apply --project="$STAGING"

      - name: Write the plan
        env:
          STAGING_ADMIN_EMAIL: ${{ secrets.STAGING_ADMIN_EMAIL }}
          REHEARSAL_IMAP_USER: ${{ secrets.REHEARSAL_IMAP_USER }}
        run: |
          REHEARSAL_PASSWORD="$(gcloud secrets versions access latest --secret=REHEARSAL_PASSWORD --project="$STAGING")"
          echo "::add-mask::$REHEARSAL_PASSWORD"
          export REHEARSAL_PASSWORD
          node scripts/rehearsal/scenario.mjs plan --scenario="${{ inputs.scenario }}" \
            --teams="${{ inputs.teams }}" --chicken="${{ inputs.chicken }}" --best="${{ inputs.best }}" \
            ${{ inputs.phone_emulators && '--phone-emulators' || '' }} \
            --api="https://europe-southwest1-$STAGING.cloudfunctions.net/api" --out=out/scenario

      - uses: actions/upload-artifact@v4
        with:
          name: scenario-plan
          path: out/scenario/
          retention-days: 7

  # The staging app with the automatic organizer and player, built once.
  app:
    name: Staging app
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - run: ./gradlew :androidApp:assembleStaging :androidApp:assembleStagingAndroidTest -Pmts.testBuildType=staging

      - uses: actions/upload-artifact@v4
        with:
          name: scenario-apks
          path: androidApp/build/outputs/apk/
          retention-days: 7

  # The organizer on a tablet: it creates the tournament, imports, assigns and invites. Its screen is recorded.
  organizer-setup:
    name: Organizer prepares the tournament
    needs: [plan, app]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/download-artifact@v4
        with:
          name: scenario-apks
          path: apks/

      - uses: actions/download-artifact@v4
        with:
          name: scenario-plan
          path: out/scenario/

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.STAGING_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.STAGING_GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Prepare the organizer
        run: |
          password="$(gcloud secrets versions access latest --secret=REHEARSAL_PASSWORD --project="$STAGING")"
          echo "::add-mask::$password"
          {
            echo "REHEARSAL_PASSWORD=$password"
            echo "REHEARSAL_API=https://europe-southwest1-$STAGING.cloudfunctions.net/api"
            echo "REHEARSAL_APKS=apks"
          } >> "$GITHUB_ENV"

      - name: Prepare the tournament on the tablet
        uses: reactivecircus/android-emulator-runner@v2
        env:
          STAGING_ADMIN_EMAIL: ${{ secrets.STAGING_ADMIN_EMAIL }}
          REHEARSAL_IMAP_USER: ${{ secrets.REHEARSAL_IMAP_USER }}
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          ram-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb shell wm size 1280x800 && adb shell wm density 160
            scripts/rehearsal/emulator-organizer.sh setup out/scenario

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: organizer-setup
          path: out/organizer-setup/
          retention-days: 14

  # Every player opens the invitation of the email and chooses the password, as on the page of the link.
  invitations:
    name: Players open their invitations
    needs: organizer-setup
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          name: scenario-plan
          path: out/scenario/

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.STAGING_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.STAGING_GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Open the invitations
        env:
          REHEARSAL_IMAP_USER: ${{ secrets.REHEARSAL_IMAP_USER }}
          REHEARSAL_IMAP_PASSWORD: ${{ secrets.REHEARSAL_IMAP_PASSWORD }}
        run: |
          echo "::add-mask::${REHEARSAL_IMAP_USER%@*}"
          REHEARSAL_PASSWORD="$(gcloud secrets versions access latest --secret=REHEARSAL_PASSWORD --project="$STAGING")"
          echo "::add-mask::$REHEARSAL_PASSWORD"
          export REHEARSAL_PASSWORD
          node scripts/rehearsal/invitations.mjs --plan=out/scenario/plan.json --minutes=30 --report=out/invitations.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: invitations
          path: out/invitations.json
          retention-days: 14

  # The organizer runs the rounds on the tablet: Play on the Timer, and the open tables closed at the end.
  organizer-play:
    name: Organizer runs the rounds
    needs: [app, organizer-setup, invitations]
    runs-on: ubuntu-latest
    timeout-minutes: 340
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/download-artifact@v4
        with:
          name: scenario-apks
          path: apks/

      - uses: actions/download-artifact@v4
        with:
          name: scenario-plan
          path: out/scenario/

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.STAGING_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.STAGING_GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Prepare the organizer
        run: |
          password="$(gcloud secrets versions access latest --secret=REHEARSAL_PASSWORD --project="$STAGING")"
          echo "::add-mask::$password"
          {
            echo "REHEARSAL_PASSWORD=$password"
            echo "REHEARSAL_API=https://europe-southwest1-$STAGING.cloudfunctions.net/api"
            echo "REHEARSAL_APKS=apks"
          } >> "$GITHUB_ENV"

      - name: Run the rounds on the tablet
        uses: reactivecircus/android-emulator-runner@v2
        env:
          STAGING_ADMIN_EMAIL: ${{ secrets.STAGING_ADMIN_EMAIL }}
          REHEARSAL_IMAP_USER: ${{ secrets.REHEARSAL_IMAP_USER }}
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          ram-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb shell wm size 1280x800 && adb shell wm density 160
            scripts/rehearsal/emulator-organizer.sh play out/scenario

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: organizer-play
          path: out/organizer-play/
          retention-days: 14

  # The players of the tables, as bots with the accounts of their invitations. The lowest slot of a table writes.
  bots:
    name: Players play the tables
    needs: [organizer-setup, invitations]
    runs-on: ubuntu-latest
    timeout-minutes: 340
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          name: scenario-plan
          path: out/scenario/

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.STAGING_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.STAGING_GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Play
        env:
          REHEARSAL_IMAP_USER: ${{ secrets.REHEARSAL_IMAP_USER }}
        run: |
          echo "::add-mask::${REHEARSAL_IMAP_USER%@*}"
          REHEARSAL_PASSWORD="$(gcloud secrets versions access latest --secret=REHEARSAL_PASSWORD --project="$STAGING")"
          echo "::add-mask::$REHEARSAL_PASSWORD"
          export REHEARSAL_PASSWORD
          players=$(jq .players out/scenario/plan.json)
          rounds=$(jq .rounds out/scenario/plan.json)
          minutes=$(jq '.matchDurationMinutes + .matchExtraMinutes' out/scenario/plan.json)
          # The organizer needs a few minutes for the Timer of each round, and the tablet starts after the bots.
          until=$(date -u -d "+$(( rounds * (minutes + 4) + 15 )) minutes" +%Y-%m-%dT%H:%M:%SZ)
          node scripts/rehearsal/bots.mjs --plan=out/scenario/plan.json --slots="1-$players" \
            --api="https://europe-southwest1-$STAGING.cloudfunctions.net/api" \
            --until="$until" --hand-seconds=30-40 --penalty-rate=0.05 --spectators=10 \
            --report=out/bots.json --title="Bots of the scenario"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bots
          path: out/bots*.json
          retention-days: 14

  check:
    name: Checks
    needs: [bots, organizer-play]
    # The checks also run when a round failed, to tell what went wrong. A cancelled run stops here.
    if: ${{ !cancelled() && needs.bots.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          name: scenario-plan
          path: out/scenario/

      - uses: actions/download-artifact@v4
        with:
          name: bots
          path: out/

      - name: Check the tournament
        run: |
          node scripts/rehearsal/report.mjs --api="https://europe-southwest1-$STAGING.cloudfunctions.net/api" \
            --tournament="$(jq -r .name out/scenario/plan.json)" --plan=out/scenario/plan.json --report=out/check.json --title="Game day checks" out/bots.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: check
          path: out/check.json
          retention-days: 30
