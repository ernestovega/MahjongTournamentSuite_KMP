# The bots of a rehearsal in staging (docs/rehearsal.md). Run it by hand from Actions > Rehearsal. It never touches
# the production project. It needs what Deploy staging needs (the STAGING_* variables and the STAGING_ADMIN_EMAIL
# secret). The password of the bot accounts lives in the Secret Manager of staging as REHEARSAL_PASSWORD: the first run
# creates it.
name: Rehearsal

on:
  workflow_dispatch:
    inputs:
      action:
        description: "calibrate: a short tournament of 16 bots, created by the run and kept in staging. passwords: the password of the accounts j02-j60. bots: the bots and spectators of the rehearsal. check: the checks after the last round. calibration-cleanup: removes the calibration accounts. mail-check: the mailbox of the game day scenarios answers. logs: the errors of the staging API in the last 3 hours."
        type: choice
        options: [calibrate, passwords, bots, check, calibration-cleanup, mail-check, logs, latency]
        default: calibrate
      tournament:
        description: "bots and check: the name of the rehearsal tournament, as in the public list."
        type: string
        default: "Ensayo General MTS 2026"
      until:
        description: "bots: when the bots stop, as 2026-11-19T19:45:00+01:00. Empty: 150 minutes after the start."
        type: string
        default: ""
      spectators:
        description: "bots: spectators, split over the three bot jobs."
        type: number
        default: 99
      hand_seconds:
        description: "Seconds between two hands of a bot table, as min-max."
        type: string
        default: "60-90"
      venue_phones:
        description: "calibrate and bots: phones of one venue wifi, all from one address, that poll like the app at its table (for example 60)."
        type: number
        default: 0
      emulators:
        description: "calibrate and bots: the real app on emulators too (slot 1 in a calibration, slots 6-9 in a rehearsal)."
        type: boolean
        default: true

concurrency:
  group: rehearsal
  cancel-in-progress: false

permissions:
  contents: read

env:
  STAGING: ${{ vars.STAGING_FIREBASE_PROJECT }}

jobs:
  # The accounts and the password, with the Admin SDK of staging.
  accounts:
    name: Accounts
    if: github.ref == 'refs/heads/main' && inputs.action != 'bots' && inputs.action != 'check' && inputs.action != 'mail-check' && inputs.action != 'logs' && inputs.action != 'latency'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check the staging project
        run: |
          if [ -z "$STAGING" ] || [ "$STAGING" = "mahjong-tournament-suite" ]; then
            echo "STAGING_FIREBASE_PROJECT is empty or names the production project." >&2
            exit 1
          fi

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: firebase/functions/package-lock.json

      - run: npm ci --no-audit --no-fund --prefix firebase/functions && npm run build --prefix firebase/functions

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.STAGING_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.STAGING_GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Create the password of the bots
        run: |
          if ! gcloud secrets describe REHEARSAL_PASSWORD --project="$STAGING" >/dev/null 2>&1; then
            openssl rand -base64 24 | tr -d '/+=\n' | head -c 24 | gcloud secrets create REHEARSAL_PASSWORD --data-file=- --project="$STAGING"
          fi

      - name: Prepare the accounts
        working-directory: firebase/functions
        env:
          STAGING_ADMIN_EMAIL: ${{ secrets.STAGING_ADMIN_EMAIL }}
          ACTION: ${{ inputs.action }}
        run: |
          export GCLOUD_PROJECT="$STAGING" EMA_FIREBASE_PROJECT="$STAGING"
          REHEARSAL_PASSWORD="$(gcloud secrets versions access latest --secret=REHEARSAL_PASSWORD --project="$STAGING")"
          echo "::add-mask::$REHEARSAL_PASSWORD"
          export REHEARSAL_PASSWORD
          case "$ACTION" in
            calibrate) mode=--calibration-setup ;;
            passwords) mode=--passwords ;;
            calibration-cleanup) mode=--calibration-cleanup ;;
          esac
          node lib/scripts/rehearsalAccounts.js "$mode" --apply --project="$STAGING"

  # The errors of the staging API, to find why a step of a game day failed. The addresses in them are masked.
  logs:
    name: Errors of the staging API
    if: github.ref == 'refs/heads/main' && inputs.action == 'logs'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.STAGING_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.STAGING_GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Read the errors
        env:
          STAGING_ADMIN_EMAIL: ${{ secrets.STAGING_ADMIN_EMAIL }}
          REHEARSAL_IMAP_USER: ${{ secrets.REHEARSAL_IMAP_USER }}
        run: |
          local_part="$(printf '%s' "${STAGING_ADMIN_EMAIL%@*}" | tr '[:upper:]' '[:lower:]')"
          local_part="${local_part%%+*}"
          for variant in "$local_part" "${local_part^}" "${local_part^^}"; do echo "::add-mask::$variant"; done
          echo "::add-mask::${REHEARSAL_IMAP_USER%@*}"
          since="$(date -u -d '-3 hours' +%Y-%m-%dT%H:%M:%SZ)"
          gcloud logging read "severity>=WARNING AND timestamp>=\"$since\" AND (resource.type=\"cloud_run_revision\" OR resource.type=\"cloud_function\")" \
            --project="$STAGING" --limit=60 --order=desc \
            --format=json \
            | jq -c '.[] | {timestamp, severity, text: .textPayload, json: .jsonPayload, status: .httpRequest.status, url: .httpRequest.requestUrl}' \
            | sed -E 's/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+/<email>/g' | cut -c1-3000
          echo "--- what the API wrote about errors ---"
          gcloud logging read "timestamp>=\"$since\" AND (textPayload:\"rror\" OR jsonPayload.message:\"rror\" OR textPayload:\"xception\")" \
            --project="$STAGING" --limit=40 --order=desc --format=json \
            | jq -c '.[] | {timestamp, severity, text: .textPayload, json: .jsonPayload}' \
            | sed -E 's/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+/<email>/g' | cut -c1-3000

  # How long the staging API took to save a hand, per 10 minutes of the last 4 hours, as Cloud Run measured it, with
  # and the new instances in the same minutes: a slow save from a cold start or from load.
  latency:
    name: Latency of the staging API
    if: github.ref == 'refs/heads/main' && inputs.action == 'latency'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.STAGING_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.STAGING_GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Read the latency
        run: |
          since="$(date -u -d '-4 hours' +%Y-%m-%dT%H:%M:%SZ)"
          gcloud logging read "resource.type=\"cloud_run_revision\" AND logName:\"run.googleapis.com%2Frequests\" AND httpRequest.requestMethod=\"POST\" AND httpRequest.requestUrl:\"/hands\" AND timestamp>=\"$since\"" \
            --project="$STAGING" --limit=30000 --format=json \
            | jq -c '.[] | {t: .timestamp[0:15], m: .httpRequest.requestMethod, u: (.httpRequest.requestUrl | sub("\\?.*"; "")), l: ((.httpRequest.latency // "0s") | rtrimstr("s") | tonumber), s: .httpRequest.status}' \
            > requests.jsonl
          echo "Requests read: $(wc -l < requests.jsonl)"
          echo "--- saves of a hand (POST .../hands), per 10 minutes: count, p50, p95, max in ms ---"
          jq -s -r '
            def pct(p): sort | .[((length - 1) * p | floor)];
            group_by(.t) | map({
              t: .[0].t,
              saves: [.[] | select(.m == "POST" and (.u | test("/tables/[0-9]+/[0-9]+/hands$"))) | .l * 1000 | round]
            }) | map(select((.saves | length) > 0))
            | .[] | "\(.t)0  saves \(.saves | length)  p50 \(.saves | pct(0.5))  p95 \(.saves | pct(0.95))  max \(.saves | max)"
          ' requests.jsonl
          echo "--- new instances started (the first request of an instance waits for it) ---"
          gcloud logging read "resource.type=\"cloud_run_revision\" AND timestamp>=\"$since\" AND (textPayload:\"STARTUP\" OR textPayload:\"Starting new instance\")" \
            --project="$STAGING" --limit=500 --format="value(timestamp)" | cut -c1-15 | sort | uniq -c

  # The mailbox of the game day scenarios (docs/scenarios.md), read by IMAP.
  mail:
    name: Mailbox of the scenarios
    if: inputs.action == 'mail-check'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Read the mailbox
        env:
          REHEARSAL_IMAP_USER: ${{ secrets.REHEARSAL_IMAP_USER }}
          REHEARSAL_IMAP_PASSWORD: ${{ secrets.REHEARSAL_IMAP_PASSWORD }}
        run: node scripts/rehearsal/mail.mjs --check

  # The staging app and its automatic player (RehearsalPlayerTest), built once for every emulator.
  app:
    name: Staging app for the emulators
    if: github.ref == 'refs/heads/main' && inputs.emulators && (inputs.action == 'calibrate' || inputs.action == 'bots')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - run: ./gradlew :androidApp:assembleStaging :androidApp:assembleStagingAndroidTest -Pmts.testBuildType=staging

      - uses: actions/upload-artifact@v4
        with:
          name: rehearsal-apks
          path: androidApp/build/outputs/apk/
          retention-days: 7

  # One emulator per machine, as phones on different networks.
  emulators:
    name: Emulator slot ${{ matrix.slot }}
    needs: app
    if: always() && needs.app.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        slot: ${{ fromJSON(inputs.action == 'calibrate' && '[1]' || '[6, 7, 8, 9]') }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/download-artifact@v4
        with:
          name: rehearsal-apks
          path: apks/

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.STAGING_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.STAGING_GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Prepare the player
        env:
          ACTION: ${{ inputs.action }}
          TOURNAMENT: ${{ inputs.tournament }}
          UNTIL: ${{ inputs.until }}
        run: |
          password="$(gcloud secrets versions access latest --secret=REHEARSAL_PASSWORD --project="$STAGING")"
          echo "::add-mask::$password"
          if [ "$ACTION" = "calibrate" ]; then
            minutes=40; account=cal; tournament="Calibración bots"; hands="20-30"
          else
            minutes=150; account=j; tournament="$TOURNAMENT"; hands="${{ inputs.hand_seconds }}"
            if [ -n "$UNTIL" ]; then minutes=$(( ($(date -d "$UNTIL" +%s) - $(date +%s)) / 60 )); fi
          fi
          {
            echo "REHEARSAL_PASSWORD=$password"
            echo "REHEARSAL_MINUTES=$minutes"
            echo "REHEARSAL_ACCOUNT=$account"
            echo "REHEARSAL_TOURNAMENT=$tournament"
            echo "REHEARSAL_HAND_SECONDS=$hands"
            echo "REHEARSAL_API=https://europe-southwest1-$STAGING.cloudfunctions.net/api"
            echo "REHEARSAL_APKS=apks"
            echo "REHEARSAL_LOGCAT=$GITHUB_WORKSPACE/out/emulator-${{ matrix.slot }}-logcat.txt"
          } >> "$GITHUB_ENV"
          mkdir -p out

      - name: Play with the app
        uses: reactivecircus/android-emulator-runner@v2
        env:
          STAGING_ADMIN_EMAIL: ${{ secrets.STAGING_ADMIN_EMAIL }}
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          ram-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb shell wm size 720x1600 && adb shell wm density 280
            scripts/rehearsal/emulator-player.sh ${{ matrix.slot }} | tee out/emulator-${{ matrix.slot }}.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-${{ matrix.slot }}
          path: out/
          retention-days: 30

  calibrate:
    name: Calibration
    needs: [accounts, app]
    if: always() && inputs.action == 'calibrate' && needs.accounts.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.STAGING_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.STAGING_GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Play the calibration tournament
        env:
          STAGING_ADMIN_EMAIL: ${{ secrets.STAGING_ADMIN_EMAIL }}
          HAND_SECONDS: ${{ inputs.hand_seconds == '60-90' && '20-30' || inputs.hand_seconds }}
        run: |
          REHEARSAL_PASSWORD="$(gcloud secrets versions access latest --secret=REHEARSAL_PASSWORD --project="$STAGING")"
          echo "::add-mask::$REHEARSAL_PASSWORD"
          export REHEARSAL_PASSWORD
          app_args=()
          if [ "${{ needs.app.result }}" = "success" ]; then app_args=(--app-slots=1 --wait-before-play=360); fi
          node scripts/rehearsal/calibrate.mjs --api="https://europe-southwest1-$STAGING.cloudfunctions.net/api" \
            --hand-seconds="$HAND_SECONDS" --venue-phones="${{ inputs.venue_phones }}" --report=out/calibration.json "${app_args[@]}"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calibration-report
          path: out/
          retention-days: 30

  # Three jobs, three machines with their own address, as phones on different networks.
  bots:
    name: Bots ${{ matrix.slots }}
    if: github.ref == 'refs/heads/main' && inputs.action == 'bots'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        slots: ["10-22", "23-35", "36-48"]
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.STAGING_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.STAGING_GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Play
        env:
          STAGING_ADMIN_EMAIL: ${{ secrets.STAGING_ADMIN_EMAIL }}
          TOURNAMENT: ${{ inputs.tournament }}
          UNTIL: ${{ inputs.until }}
          SPECTATORS: ${{ inputs.spectators }}
          HAND_SECONDS: ${{ inputs.hand_seconds }}
          SLOTS: ${{ matrix.slots }}
        run: |
          REHEARSAL_PASSWORD="$(gcloud secrets versions access latest --secret=REHEARSAL_PASSWORD --project="$STAGING")"
          echo "::add-mask::$REHEARSAL_PASSWORD"
          export REHEARSAL_PASSWORD
          until_arg=()
          if [ -n "$UNTIL" ]; then until_arg=(--until="$UNTIL"); fi
          node scripts/rehearsal/bots.mjs --api="https://europe-southwest1-$STAGING.cloudfunctions.net/api" \
            --tournament="$TOURNAMENT" --slots="$SLOTS" --spectators=$(( SPECTATORS / 3 )) --hand-seconds="$HAND_SECONDS" \
            "${until_arg[@]}" --report="out/bots-${SLOTS}.json" --title="Bots $SLOTS (GitHub)"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bots-${{ matrix.slots }}
          path: out/
          retention-days: 30

  # The phones of one venue wifi: one machine, one address, many phones polling like the app at their tables.
  venue:
    name: Venue wifi (${{ inputs.venue_phones }} phones)
    if: github.ref == 'refs/heads/main' && inputs.action == 'bots' && inputs.venue_phones > 0
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Poll like the phones of the venue
        env:
          TOURNAMENT: ${{ inputs.tournament }}
          UNTIL: ${{ inputs.until }}
        run: |
          until_arg=()
          if [ -n "$UNTIL" ]; then until_arg=(--until="$UNTIL"); fi
          node scripts/rehearsal/bots.mjs --api="https://europe-southwest1-$STAGING.cloudfunctions.net/api" \
            --tournament="$TOURNAMENT" --slots="" --venue-phones="${{ inputs.venue_phones }}" \
            "${until_arg[@]}" --report=out/bots-venue.json --title="Venue wifi"
        # The bots need no password here: the phones only read.

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bots-venue
          path: out/
          retention-days: 30

  check:
    name: Checks
    needs: [bots, venue]
    if: always() && github.ref == 'refs/heads/main' && (inputs.action == 'bots' || inputs.action == 'check')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # The reports of the bot jobs of this run. A check run alone checks the tournament without them.
      - uses: actions/download-artifact@v4
        if: inputs.action == 'bots'
        with:
          pattern: bots-*
          path: out/
          merge-multiple: true

      - name: Check the tournament
        env:
          TOURNAMENT: ${{ inputs.tournament }}
        run: |
          shopt -s nullglob
          node scripts/rehearsal/report.mjs --api="https://europe-southwest1-$STAGING.cloudfunctions.net/api" \
            --tournament="$TOURNAMENT" --report=out/check.json --title="Rehearsal checks" out/bots-*.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rehearsal-check
          path: out/check.json
          retention-days: 30
