# Web E2E tests: the Wasm Player in Chromium (Playwright) against the local test backend on the Firebase emulators.
# Nothing touches production or staging. See e2e/web/README.md.
name: Test · Web E2E

on:
  # Every night at 03:30 UTC on main (no gate on the pull requests until production).
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-e2e:
    name: Web E2E (Player)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            firebase/functions/package-lock.json
            e2e/web/package-lock.json

      - name: Build the Player web app
        run: ./gradlew :playerApp:wasmJsBrowserDistribution

      - name: Install the backend and Playwright
        run: |
          npm ci --no-audit --no-fund
          npm ci --no-audit --no-fund --prefix firebase/functions
          npm ci --no-audit --no-fund --prefix e2e/web
          npx --prefix e2e/web playwright install --with-deps chromium

      - name: Start the test backend
        run: |
          export PATH="$GITHUB_WORKSPACE/node_modules/.bin:$PATH"
          cd firebase/functions
          E2E_JAVA_HOME="$JAVA_HOME" nohup npm run e2e:backend > "$RUNNER_TEMP/backend.log" 2>&1 &
          for i in $(seq 1 90); do
            curl -sf http://127.0.0.1:5055/api/health > /dev/null && exit 0
            sleep 2
          done
          cat "$RUNNER_TEMP/backend.log"
          exit 1

      - name: Run the web E2E tests
        run: npm test --prefix e2e/web

      - name: Show the backend log
        if: failure()
        run: tail -200 "$RUNNER_TEMP/backend.log"
