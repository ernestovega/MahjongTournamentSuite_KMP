# Shows, for each product, the version on main and the published one: the web and the backend as the site answers
# them, and the Android app on each Google Play track. Run it with Actions > Versions > Run workflow and read the
# table in the summary of the run. It only reads: it deploys and uploads nothing. See docs/versioning.md.
name: Versions

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  versions:
    name: Published versions
    # Google Cloud only lets workflows on main sign in (scripts/setup-github-deploy.sh).
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install the Google Play client
        run: pip install --quiet google-auth google-api-python-client

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Show the versions
        run: python3 scripts/versions.py status
