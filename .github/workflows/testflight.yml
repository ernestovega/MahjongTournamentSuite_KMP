# Uploads the iOS app (Release, com.etologic.mahjongtournamentsuite) to App Store Connect, where it goes to TestFlight.
# Only by hand, from Actions > Publish · TestFlight, like the Google Play upload. The version is the one of the catalog
# (admin-versionName and admin-versionCode): App Store Connect refuses a build number it already has, so bump the
# versions before running it again. See docs/ios-release.md.
#
# The signing is automatic: with the App Store Connect API key (Admin access) Xcode makes the distribution certificate
# and the profile in the cloud. Secret: APP_STORE_CONNECT_API_KEY, the content of the .p8 file.
name: Publish · TestFlight

on:
  workflow_dispatch:

concurrency:
  group: testflight
  cancel-in-progress: false

permissions:
  contents: read

env:
  ASC_KEY_ID: 9PB52BW2Y6
  ASC_ISSUER_ID: 9ec15174-5e83-4917-9dd6-6fb152d6d888
  TEAM_ID: PG2F9TPVFV

jobs:
  testflight:
    name: Archive and upload to TestFlight
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: App Store Connect API key
        env:
          API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          if [ -z "$API_KEY" ]; then echo "The secret APP_STORE_CONNECT_API_KEY is missing."; exit 1; fi
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s\n' "$API_KEY" > "$RUNNER_TEMP/asc/AuthKey_$ASC_KEY_ID.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/asc/AuthKey_$ASC_KEY_ID.p8" >> "$GITHUB_ENV"

      # The release framework for devices, here first so its errors are easy to read.
      - name: Link the Kotlin framework
        run: ./gradlew :suite:linkReleaseFrameworkIosArm64

      - name: Archive
        run: |
          mkdir -p build
          set -o pipefail
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/MTS.xcarchive \
            -derivedDataPath build/ios-release \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            archive > build/archive.log 2>&1 || { grep -nE "error|e: |FAILURE|What went wrong" -A3 build/archive.log | head -150; exit 1; }
          grep -E "Version |Firebase: " build/archive.log || true

      - name: Upload to App Store Connect
        run: |
          cat > build/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath build/MTS.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" 2>&1 | tail -40

      - name: Delete the key
        if: always()
        run: rm -f "$RUNNER_TEMP/asc/"*.p8

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: testflight-logs
          path: |
            build/archive.log
            build/export/*.log
          if-no-files-found: ignore
